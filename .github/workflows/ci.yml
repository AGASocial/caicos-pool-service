name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  admin-portal:
    name: Admin Portal CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-portal

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          CI: true

  technician-app:
    name: Technician App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./technician-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: technician-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Run tests
        run: npm test -- --passWithNoTests || true
        continue-on-error: true
        env:
          CI: true

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [admin-portal, technician-app]
    if: always()
    steps:
      - name: Check admin-portal status
        if: needs.admin-portal.result != 'success'
        run: exit 1

      - name: Technician app can fail (optional checks)
        if: needs.technician-app.result != 'success'
        run: echo "Technician app checks failed but not blocking"

      - name: Summary
        run: |
          echo "✅ Admin Portal: ${{ needs.admin-portal.result }}"
          echo "ℹ️  Technician App: ${{ needs.technician-app.result }} (non-blocking)"
